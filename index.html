<!doctype html>
<html lang="ja">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LIFE CITY" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#bfe3f0" />
  <meta name="description" content="学ぶ。働く。建てる。暮らす。街と一緒に成長する。" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>LIFE CITY</title>
  <script type="module" crossorigin src="./assets/index-KS7ohuti.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-nAlAbrii.css">
</head>
<body>
  <canvas id="city" aria-label="3Dの街"></canvas>

  <header class="hud" aria-live="polite">
    <div class="hud-plate">
      <span class="hud-item coins" title="まちコイン"><i class="coin" aria-hidden="true"></i><b id="hud-coins">0</b></span>
      <span class="hud-item" title="人口"><span aria-hidden="true">👥</span><b id="hud-pop">0</b><small>人</small></span>
      <span class="hud-item date" id="hud-date">1年目 4月1日</span>
    </div>
    <button class="hud-btn" id="btn-speed" aria-label="時間の進み方">▶</button>
    <button class="hud-btn" id="btn-menu" aria-label="メニュー">☰</button>
  </header>

  <nav class="side-rail" aria-label="お知らせ">
    <button class="hud-btn event" id="btn-event" aria-label="街のできごと" hidden>📣</button>
    <button class="hud-btn sites" id="btn-sites" aria-label="工事中の建物" hidden>🏗️</button>
    <button class="hud-btn sites" id="btn-home" aria-label="おうちのお仕事" hidden>🏠</button>
    <button class="hud-btn sites" id="btn-voices" aria-label="住民の声" hidden>📮</button>
  </nav>

  <div class="hint-line" id="hint-line" role="status"></div>

  <div class="palette" id="palette" hidden></div>

  <div class="confirm" id="confirm" hidden>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn ghost" id="confirm-no">やめる</button>
      <button class="btn primary" id="confirm-yes">決定</button>
    </div>
    <button class="btn extra" id="confirm-extra" hidden></button>
  </div>

  <button class="license-fab" id="btn-license"><span aria-hidden="true">📜</span>資格・仕事</button>
  <button class="study-fab" id="btn-study"><span class="pencil" aria-hidden="true">✏️</span><span>勉強して<br />コインをかせぐ</span></button>

  <nav class="toolbar" id="toolbar" aria-label="道具">
    <button data-tool="inspect" class="on"><span aria-hidden="true">🔍</span>見る</button>
    <button data-tool="land"><span aria-hidden="true">🗺️</span>土地</button>
    <button data-tool="road"><span aria-hidden="true">🛣️</span>道路</button>
    <button data-tool="build"><span aria-hidden="true">🏗️</span>建てる</button>
    <button data-tool="remove"><span aria-hidden="true">🧹</span>撤去</button>
  </nav>

  <div class="toast" id="toast" role="alert"></div>

  <!-- sheets -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

</body>
</html>
